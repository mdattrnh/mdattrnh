<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="AI learning path: now learning AI fundamentals, next LLM apps, then RAG, with the goal of building AI projects">
<style>.tag{font:700 16px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;text-anchor:middle;letter-spacing:2px}.h{font:700 25px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#F4F6FF;text-anchor:middle}.s{font:500 18px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#AEB8DA;text-anchor:middle}
.flow{stroke-dasharray:10 12;animation:f 1.4s linear infinite}.ring{animation:r 2.4s ease-out infinite}
@keyframes f{to{stroke-dashoffset:-22}}@keyframes r{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="180" rx="18" fill="#0B1026"/>
<line x1="165" y1="70" x2="1035" y2="70" stroke="#39406B" stroke-width="3" class="flow"/>
<circle cx="165" cy="70" r="20" fill="none" stroke="#22D3EE" stroke-width="2.5" class="ring" style="transform-origin:165px 70px"/><circle cx="165" cy="70" r="13" fill="#22D3EE" stroke="#22D3EE" stroke-width="3"/>
<text x="165" y="28" class="tag" fill="#22D3EE">NOW</text><text x="165" y="125" class="h">Learning</text><text x="165" y="155" class="s">AI fundamentals</text><circle cx="455" cy="70" r="13" fill="#151B3A" stroke="#A78BFA" stroke-width="3"/>
<text x="455" y="28" class="tag" fill="#A78BFA">NEXT</text><text x="455" y="125" class="h">LLM apps</text><text x="455" y="155" class="s">APIs &amp; prompting</text><circle cx="745" cy="70" r="13" fill="#151B3A" stroke="#A78BFA" stroke-width="3"/>
<text x="745" y="28" class="tag" fill="#A78BFA">THEN</text><text x="745" y="125" class="h">RAG</text><text x="745" y="155" class="s">Search &amp; evaluation</text><circle cx="1035" cy="70" r="13" fill="#151B3A" stroke="#F472B6" stroke-width="3"/>
<text x="1035" y="28" class="tag" fill="#F472B6">GOAL</text><text x="1035" y="125" class="h">AI projects</text><text x="1035" y="155" class="s">Build &amp; ship my own</text></svg>