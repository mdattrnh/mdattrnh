<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="SoftEdge: E-commerce website with cart, orders and payments. Built the MVC structure and a 17-table MySQL schema. Tools: PHP, MySQL, JavaScript, AJAX, Bootstrap">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="1" stop-color="#1B1447"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect width="600" height="260" rx="18"/></clipPath></defs>
<style>.tg{font:700 15px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#A78BFA;letter-spacing:.5px}.t{font:800 32px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#F4F6FF}.d{font:500 18.5px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#AEB8DA}.chip{font:600 15.5px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#F4F6FF;text-anchor:middle}.f{font:600 15px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#A78BFA}
.sw{animation:sw 5s ease-in-out infinite alternate}.dot{animation:dt 2.4s ease-in-out infinite}@keyframes sw{from{transform:translateX(-360px)}to{transform:translateX(360px)}}@keyframes dt{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="600" height="260" rx="18" fill="url(#bg)"/><rect x=".75" y=".75" width="598.5" height="258.5" rx="17.5" fill="none" stroke="#39406B" stroke-width="1.5"/>
<g clip-path="url(#cp)"><rect class="sw" x="60" width="480" height="5" fill="url(#sh)"/></g>
<circle class="dot" cx="40" cy="38" r="6" fill="#A78BFA"/><text x="56" y="43" class="tg">Team leader · Web app</text>
<text x="34" y="84" class="t">SoftEdge</text><text x="34" y="118" class="d">E-commerce website with cart, orders and payments.</text><text x="34" y="146" class="d">Built the MVC structure and a 17-table MySQL schema.</text><rect x="34" y="176" width="59" height="34" rx="17" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".55"/><text x="63.5" y="198" class="chip">PHP</text><rect x="103" y="176" width="80" height="34" rx="17" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".55"/><text x="143.0" y="198" class="chip">MySQL</text><rect x="193" y="176" width="132" height="34" rx="17" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".55"/><text x="259.0" y="198" class="chip">JavaScript</text><rect x="335" y="176" width="69" height="34" rx="17" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".55"/><text x="369.5" y="198" class="chip">AJAX</text><rect x="414" y="176" width="121" height="34" rx="17" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".55"/><text x="474.5" y="198" class="chip">Bootstrap</text>
<text x="34" y="241" class="f">View repository  →</text></svg>