<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="MelodyVerse: Android music-sharing social app with offline sync, realtime updates and an admin dashboard. Tools: Java, Android, Firebase, SQLite, JUnit">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="1" stop-color="#1B1447"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<clipPath id="cp"><rect width="600" height="260" rx="18"/></clipPath></defs>
<style>.tg{font:700 15px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#22D3EE;letter-spacing:.5px}.t{font:800 32px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#F4F6FF}.d{font:500 18.5px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#AEB8DA}.chip{font:600 15.5px ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;fill:#F4F6FF;text-anchor:middle}.f{font:600 15px -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#22D3EE}
.sw{animation:sw 5s ease-in-out infinite alternate}.dot{animation:dt 2.4s ease-in-out infinite}@keyframes sw{from{transform:translateX(-360px)}to{transform:translateX(360px)}}@keyframes dt{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="600" height="260" rx="18" fill="url(#bg)"/><rect x=".75" y=".75" width="598.5" height="258.5" rx="17.5" fill="none" stroke="#39406B" stroke-width="1.5"/>
<g clip-path="url(#cp)"><rect class="sw" x="60" width="480" height="5" fill="url(#sh)"/></g>
<circle class="dot" cx="40" cy="38" r="6" fill="#22D3EE"/><text x="56" y="43" class="tg">Mobile app</text>
<text x="34" y="84" class="t">MelodyVerse</text><text x="34" y="118" class="d">Android music-sharing social app with offline</text><text x="34" y="146" class="d">sync, realtime updates and an admin dashboard.</text><rect x="34" y="176" width="69" height="34" rx="17" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".55"/><text x="68.5" y="198" class="chip">Java</text><rect x="113" y="176" width="100" height="34" rx="17" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".55"/><text x="163.0" y="198" class="chip">Android</text><rect x="223" y="176" width="111" height="34" rx="17" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".55"/><text x="278.5" y="198" class="chip">Firebase</text><rect x="344" y="176" width="90" height="34" rx="17" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".55"/><text x="389.0" y="198" class="chip">SQLite</text><rect x="444" y="176" width="80" height="34" rx="17" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".55"/><text x="484.0" y="198" class="chip">JUnit</text>
<text x="34" y="241" class="f">View repository  →</text></svg>